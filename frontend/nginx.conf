# Serve a SPA e faz proxy de /api para o backend na mesma origem (sem CORS em produção).

# O nginx do host repassa o IP real do cliente; só confia nele vindo da rede Docker.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Real-IP;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

# Escritas (criar, alterar, excluir, mandar mensagem) têm cota bem menor que leituras:
# é o que um visitante mal-intencionado usaria para encher o banco. Chave vazia = sem limite.
map $request_method $write_limit_key {
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $write_limit_key zone=writes:10m rate=30r/m;

# Cada aba aberta mantém uma conexão de tempo real; um teto por IP evita esgotar o servidor.
limit_conn_zone $binary_remote_addr zone=streams:10m;
limit_conn_status 429;

upstream logos_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security_headers.inc;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://logos_api;
        include /etc/nginx/snippets/proxy_params.inc;
    }

    # Stream SSE (ADR-0014): sem buffer (cada evento sai na hora) e conexão longa.
    # O servidor manda "ping" a cada 15 s, então 1 h de leitura sem dados nunca acontece.
    location = /api/stream {
        limit_conn streams 6;
        proxy_pass http://logos_api;
        include /etc/nginx/snippets/proxy_params.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    # Swagger UI carrega JS/CSS do jsDelivr: CSP própria, mais permissiva, só nesta rota.
    location = /api/docs {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://logos_api;
        include /etc/nginx/snippets/proxy_params.inc;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=writes burst=15 nodelay;
        client_max_body_size 64k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass http://logos_api;
        include /etc/nginx/snippets/proxy_params.inc;
    }

    # Arquivos com hash no nome: cache longo e imutável.
    location /assets/ {
        include /etc/nginx/snippets/security_headers.inc;
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # index.html nunca em cache, para que um deploy novo chegue na hora.
    location / {
        include /etc/nginx/snippets/security_headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
