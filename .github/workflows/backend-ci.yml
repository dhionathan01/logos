name: Backend CI

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  workflow_call: # na main, roda como etapa do workflow de deploy

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logos
          POSTGRES_PASSWORD: logos
          POSTGRES_DB: logos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logos"
          --health-interval 3s
          --health-retries 20

    env:
      LOGOS_TEST_DATABASE_URL: postgresql+psycopg://logos:logos@localhost:5432/logos_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Ruff (lint + formatação)
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Mypy (strict)
        run: mypy app

      - name: Pytest + cobertura
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85

      - name: Migrações reversíveis
        env:
          LOGOS_DATABASE_URL: ${{ env.LOGOS_TEST_DATABASE_URL }}
        run: alembic downgrade base && alembic upgrade head
