name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # nunca interromper um deploy no meio

permissions:
  contents: read

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    uses: ./.github/workflows/frontend-ci.yml

  images:
    name: Build e push das imagens (${{ matrix.service }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: backend
            target: runtime
          - service: web
            context: frontend
            target: runtime
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy na VPS
    needs: images
    runs-on: ubuntu-latest
    # Repositório privado (ADR-0016): as imagens no GHCR também são privadas, então a VPS
    # precisa do token com leitura de pacotes. Secrets e APP_URL ficam no nível do repositório.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH (host key fixada, sem confiar no primeiro acesso)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar compose e script de deploy
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key infra/docker-compose.prod.yml infra/scripts/deploy.sh "$TARGET:/opt/logos/"

      - name: Atualizar containers (com rollback automático)
        env:
          TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          # O token vai por stdin (nunca na linha de comando remota) e é descartado ao final.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$TARGET" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null \
             && bash /opt/logos/deploy.sh '$SHA'; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"

      - name: Smoke test público
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 5 "$APP_URL/api/health/ready"; then exit 0; fi
            sleep 5
          done
          exit 1
