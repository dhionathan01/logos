# Ambiente de desenvolvimento: banco + API com hot reload.
# Uso: docker compose -f docker-compose.dev.yml up
name: logos-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos
      POSTGRES_DB: logos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos"]
      interval: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: dev
    environment:
      LOGOS_DATABASE_URL: postgresql+psycopg://logos:logos@db:5432/logos
      LOGOS_TEST_DATABASE_URL: postgresql+psycopg://logos:logos@db:5432/logos_test
      LOGOS_SEED_DEMO_DATA: "true"
    command: >
      sh -c "alembic upgrade head && python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
